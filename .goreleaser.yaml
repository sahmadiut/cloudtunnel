version: 2

project_name: cloudtunnel

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cloudtunnel
    binary: cloudtunnel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

release:
  prerelease: auto  # v1.0.0-beta.1 → pre-release
  
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
